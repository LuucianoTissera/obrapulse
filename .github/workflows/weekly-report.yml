name: Reporte semanal automático

# Demuestra la automatización "sin humanos": cada lunes se ejecuta el pipeline y
# se publica el reporte como artefacto. En una empresa real, apuntaría a los partes y bases reales.
on:
  schedule:
    - cron: "0 11 * * 1"   # lunes 08:00 hora Argentina (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: obrapulse demo
        env:
          # Opcional: si cargás el secreto, se activa el modo híbrido con LLM
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: reporte-semanal
          path: |
            reports/reporte_latest.html
            reports/resumen_latest.json
